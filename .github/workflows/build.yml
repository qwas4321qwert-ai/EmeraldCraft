name: Build mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -q emeraldcraft-fabric-26.2.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Build
        working-directory: emeraldcraft
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: emeraldcraft-mod
          path: |
            emeraldcraft/build/libs/*.jar
            !emeraldcraft/build/libs/*-sources.jar
